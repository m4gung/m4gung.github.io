<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suara Hewan</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'display': ['Fredoka One', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* Latar belakang ceria pastel */
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            background-image: radial-gradient(#bae6fd 3px, transparent 3px), radial-gradient(#bae6fd 3px, transparent 3px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            min-height: 100vh;
            overflow-x: hidden;
            color: #334155;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animasi Membal (Pop) */
        @keyframes pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.15) translateY(-10px);
            }

            60% {
                transform: scale(0.95) translateY(5px);
            }

            100% {
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Animasi Bergetar (Shake) untuk jawaban salah */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-15px) rotate(-8deg);
            }

            75% {
                transform: translateX(15px) rotate(8deg);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Animasi Mengambang untuk menu utama */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        /* Gaya Tombol 3D Bouncy */
        .btn-3d {
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-3d:active {
            transform: translateY(10px) !important;
            box-shadow: 0 0px 0 0 currentcolor !important;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="flex flex-col items-center no-select pb-12">

    <!-- SCREEN: MENU UTAMA -->
    <div id="screen-menu"
        class="w-full max-w-2xl flex flex-col items-center justify-center min-h-screen p-6 text-center transition-all duration-300">
        <div
            class="bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-[3rem] shadow-2xl border-8 border-white w-full animate-float">
            <h1 class="font-display text-5xl md:text-6xl text-sky-500 mb-4 drop-shadow-sm leading-tight">
                Suara Hewan! 🐾
            </h1>
            <p class="text-2xl text-gray-600 mb-10 font-bold">Ayo kenali teman-teman hewan kita!</p>

            <div class="flex flex-col md:flex-row justify-center gap-6">
                <!-- Tombol Belajar -->
                <button onclick="goToLearn()"
                    class="btn-3d flex-1 bg-green-200 hover:bg-green-300 text-green-900 text-3xl font-black py-8 px-6 rounded-[2.5rem] shadow-[0_12px_0_#22c55e] border-4 border-white flex flex-col items-center justify-center gap-3">
                    <span class="text-6xl mb-2 drop-shadow-md">👀</span>
                    Lihat Hewan
                </button>
                <!-- Tombol Bermain -->
                <button onclick="goToGame()"
                    class="btn-3d flex-1 bg-yellow-300 hover:bg-yellow-400 text-yellow-900 text-3xl font-black py-8 px-6 rounded-[2.5rem] shadow-[0_12px_0_#eab308] border-4 border-white flex flex-col items-center justify-center gap-3">
                    <span class="text-6xl mb-2 drop-shadow-md">🎧</span>
                    Tebak Suara
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN: BELAJAR -->
    <div id="screen-learn" class="hidden w-full max-w-5xl flex-col items-center pt-8 px-4">
        <header class="w-full flex items-center justify-between mb-8 max-w-4xl">
            <button onclick="goToMenu()"
                class="btn-3d bg-white text-gray-600 font-bold text-xl py-3 px-6 rounded-full shadow-[0_8px_0_#cbd5e1] border-4 border-white flex items-center gap-2">
                <span>⬅️</span> Kembali
            </button>
            <h2
                class="font-display text-3xl text-white bg-green-500 px-8 py-3 rounded-full border-4 border-white shadow-lg">
                Siapa Ini?</h2>
        </header>

        <!-- Grid Hewan -->
        <div id="learn-grid"
            class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full max-w-4xl bg-white/80 p-6 md:p-8 rounded-[3rem] border-8 border-white shadow-2xl">
            <!-- Diisi oleh JS -->
        </div>
    </div>

    <!-- SCREEN: GAME -->
    <div id="screen-game" class="hidden w-full max-w-4xl flex-col items-center pt-8 px-4">
        <header class="w-full flex items-center justify-between mb-8 max-w-3xl">
            <button onclick="goToMenu()"
                class="btn-3d bg-white text-gray-600 font-bold text-xl py-3 px-6 rounded-full shadow-[0_8px_0_#cbd5e1] border-4 border-white flex items-center gap-2">
                <span>⬅️</span> Kembali
            </button>
            <h2
                class="font-display text-3xl text-white bg-yellow-500 px-8 py-3 rounded-full border-4 border-white shadow-lg">
                Tebak Suara!</h2>
        </header>

        <div
            class="bg-white/90 p-8 md:p-12 rounded-[3rem] shadow-2xl border-8 border-white w-full max-w-3xl text-center flex flex-col items-center">

            <div class="bg-sky-50 px-8 py-6 rounded-[2.5rem] border-4 border-sky-200 w-full mb-8">
                <p class="text-2xl text-gray-600 font-bold mb-4">Dengarkan baik-baik:</p>
                <div class="flex flex-col items-center justify-center gap-4">
                    <button onclick="repeatQuestion()"
                        class="btn-3d bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold p-6 rounded-full shadow-[0_10px_0_#ca8a04] border-4 border-white text-6xl"
                        title="Dengarkan lagi">
                        🔊
                    </button>
                    <p id="game-sound-text" class="font-display text-3xl text-sky-600 mt-2">"..."</p>
                </div>
            </div>

            <p class="text-2xl text-gray-500 font-bold mb-6">Pilih hewannya:</p>
            <div id="game-options" class="flex justify-center gap-6 md:gap-8 w-full flex-wrap mb-4">
                <!-- Diisi oleh JS -->
            </div>

            <div id="game-feedback"
                class="mt-4 text-3xl font-display h-12 transition-all flex items-center justify-center w-full"></div>
        </div>
    </div>

    <script>
        // Data Hewan
        const animalsData = [
            { id: 'kucing', name: 'Kucing', emoji: '🐱', soundText: 'Meong meong', bg: 'bg-pink-300', shadow: 'shadow-[0_12px_0_#db2777]' },
            { id: 'anjing', name: 'Anjing', emoji: '🐶', soundText: 'Guk guk guk', bg: 'bg-blue-300', shadow: 'shadow-[0_12px_0_#2563eb]' },
            { id: 'sapi', name: 'Sapi', emoji: '🐮', soundText: 'Mooooo', bg: 'bg-green-300', shadow: 'shadow-[0_12px_0_#16a34a]' },
            { id: 'burung', name: 'Burung', emoji: '🐦', soundText: 'Cuit cuit cuit', bg: 'bg-yellow-300', shadow: 'shadow-[0_12px_0_#ca8a04]' },
            { id: 'bebek', name: 'Bebek', emoji: '🦆', soundText: 'Kwek kwek kwek', bg: 'bg-orange-300', shadow: 'shadow-[0_12px_0_#ea580c]' },
            { id: 'harimau', name: 'Harimau', emoji: '🐯', soundText: 'Roaarrr', bg: 'bg-purple-300', shadow: 'shadow-[0_12px_0_#9333ea]' },
            { id: 'kuda', name: 'Kuda', emoji: '🐴', soundText: 'Hiii hii hii', bg: 'bg-teal-300', shadow: 'shadow-[0_12px_0_#0d9488]' },
            { id: 'domba', name: 'Domba', emoji: '🐑', soundText: 'Mbeeeek', bg: 'bg-slate-300', shadow: 'shadow-[0_12px_0_#475569]' }
        ];

        let currentTarget = null;
        let isWaitingForNext = false;

        function speak(text, callback = null) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.8; // Cukup lambat agar jelas untuk anak-anak
            utterance.pitch = 1.3; // Nada tinggi (ceria)

            if (callback) {
                utterance.onend = callback;
            }

            window.speechSynthesis.speak(utterance);
        }

        function hideAllScreens() {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('flex');
            document.getElementById('screen-learn').classList.add('hidden');
            document.getElementById('screen-learn').classList.remove('flex');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('flex');
        }

        function goToMenu() {
            hideAllScreens();
            const el = document.getElementById('screen-menu');
            el.classList.remove('hidden');
            el.classList.add('flex');
            window.speechSynthesis.cancel();
        }

        function goToLearn() {
            hideAllScreens();
            const el = document.getElementById('screen-learn');
            el.classList.remove('hidden');
            el.classList.add('flex');

            speak("Ayo tekan hewannya!");
            renderLearnGrid();
        }

        function renderLearnGrid() {
            const grid = document.getElementById('learn-grid');
            grid.innerHTML = '';

            animalsData.forEach(animal => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-full aspect-square rounded-[2rem] border-[6px] border-white ${animal.bg} ${animal.shadow} flex items-center justify-center flex-col gap-2`;

                btn.innerHTML = `
                    <span class="text-7xl md:text-8xl drop-shadow-lg">${animal.emoji}</span>
                `;

                btn.onclick = () => {
                    btn.classList.remove('animate-pop');
                    void btn.offsetWidth;
                    btn.classList.add('animate-pop');
                    // Kalimat belajar
                    speak(`Ini ${animal.name}. Suaranya, ${animal.soundText}`);
                };

                grid.appendChild(btn);
            });
        }

        function goToGame() {
            hideAllScreens();
            const el = document.getElementById('screen-game');
            el.classList.remove('hidden');
            el.classList.add('flex');

            isWaitingForNext = false;
            generateGameRound();
        }

        function generateGameRound() {
            isWaitingForNext = false;
            const fb = document.getElementById('game-feedback');
            fb.innerText = "";
            fb.className = "mt-4 text-3xl font-display h-12 transition-all flex items-center justify-center w-full";

            // Pilih 1 hewan yang benar
            currentTarget = animalsData[Math.floor(Math.random() * animalsData.length)];

            // Pilih 2 hewan salah
            let options = [currentTarget];
            while (options.length < 3) {
                let randomAnimal = animalsData[Math.floor(Math.random() * animalsData.length)];
                if (!options.find(o => o.id === randomAnimal.id)) {
                    options.push(randomAnimal);
                }
            }

            // Acak posisi 3 kartu
            options.sort(() => 0.5 - Math.random());

            document.getElementById('game-sound-text').innerText = `"${currentTarget.soundText}"`;

            const container = document.getElementById('game-options');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-32 h-32 md:w-40 md:h-40 rounded-[2.5rem] border-[6px] border-white ${opt.bg} ${opt.shadow} flex items-center justify-center bg-white`;

                btn.innerHTML = `<span class="text-6xl md:text-7xl drop-shadow-md">${opt.emoji}</span>`;

                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });

            repeatQuestion();
        }

        function repeatQuestion() {
            if (currentTarget) {
                speak(`${currentTarget.soundText} ... Suara hewan apakah ini?`);
            }
        }

        function checkAnswer(selectedAnimal, btn) {
            if (isWaitingForNext) return;

            const fb = document.getElementById('game-feedback');

            if (selectedAnimal.id === currentTarget.id) {
                isWaitingForNext = true;
                btn.classList.add('animate-pop');
                fb.innerText = "Yey! Benar Sekali! 🎉";
                fb.className = "mt-4 text-3xl md:text-4xl font-display h-12 text-green-500 animate-pop flex items-center justify-center w-full";

                speak(`Pintar! Itu suara ${currentTarget.name}`, () => {
                    setTimeout(generateGameRound, 1200);
                });
            } else {
                btn.classList.remove('animate-shake');
                void btn.offsetWidth;
                btn.classList.add('animate-shake');

                fb.innerText = "Ups! Coba lagi 🤔";
                fb.className = "mt-4 text-3xl md:text-4xl font-display h-12 text-red-500 animate-pop flex items-center justify-center w-full";
                speak("Ups, coba hewan yang lain");
            }
        }
    </script>
</body>

</html>
