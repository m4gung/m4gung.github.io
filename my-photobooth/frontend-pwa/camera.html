<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <title>My Photobooth - Kamera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="camera-page">
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>My Photobooth</h1>
      <p class="subtitle">Mode Kamera</p>
    </div>

    <!-- Status -->
    <div class="status">
      <span id="cameraStatus" class="status-dot offline"></span>
      <span id="cameraStatusText">Meminta akses kamera...</span>
    </div>

    <!-- Camera Preview -->
    <div class="preview-box" id="previewBox">
      <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div id="cameraOverlay" class="overlay">
        <p>Izinkan akses kamera</p>
        <button id="requestCameraBtn" class="btn btn-primary">Buka Kamera</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/socket-client.js"></script>
  <script src="js/webrtc-core.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      WebRTCCore.init();
      App.init();
      
      document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
        const box = document.getElementById('previewBox');
        const btn = document.getElementById('fullscreenBtn');
        box.classList.toggle('fullscreen');
        btn.textContent = box.classList.contains('fullscreen') ? '✕' : '⛶';
      });
    });
  </script>
</body>
</html>
