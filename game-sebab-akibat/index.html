<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Sebab-Akibat</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'display': ['Fredoka One', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            /* Mencegah zoom, scroll, dan seleksi teks saat anak memencet layar sembarangan */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: background-color 0.8s ease;
            z-index: 1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            pointer-events: none;
            /* Agar klik tembus ke canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1rem;
        }

        /* Tombol Mode */
        .btn-mode {
            pointer-events: auto;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s, filter 0.3s;
            cursor: pointer;
        }

        .btn-mode:active {
            transform: translateY(8px) scale(0.95);
            box-shadow: 0 0px 0 0 currentcolor !important;
        }

        .btn-mode.active-mode {
            filter: brightness(1.1);
            transform: scale(1.1);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        @keyframes float-text {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float-text {
            animation: float-text 3s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <!-- Wadah Latar Belakang (Warna berubah sesuai mode) -->
    <div id="bg-container" class="bg-blue-200"></div>

    <!-- Kanvas untuk merender efek visual -->
    <canvas id="gameCanvas"></canvas>

    <!-- Lapisan Antarmuka (UI) -->
    <div class="ui-layer">

        <!-- Instruksi -->
        <div class="text-center w-full pt-4 md:pt-10">
            <h1 id="instruction-text"
                class="font-display text-4xl md:text-6xl text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)] animate-float-text tracking-wide"
                style="text-shadow: 2px 2px 0 #333, -2px -2px 0 #333, 2px -2px 0 #333, -2px 2px 0 #333, 0 4px 10px rgba(0,0,0,0.5);">
                Sentuh layarnya!
            </h1>
        </div>

        <!-- Tombol Pilihan Mode -->
        <div class="flex justify-center gap-3 md:gap-8 pb-4 md:pb-8 w-full max-w-3xl mx-auto">
            <button onclick="setMode('bubbles')" id="btn-bubbles"
                class="btn-mode active-mode flex-1 bg-cyan-400 text-cyan-900 font-bold text-lg md:text-2xl py-4 rounded-[2rem] shadow-[0_8px_0_#0891b2] border-4 border-white flex flex-col items-center gap-1">
                <span class="text-3xl md:text-4xl">🫧</span> Gelembung
            </button>
            <button onclick="setMode('fireworks')" id="btn-fireworks"
                class="btn-mode flex-1 bg-rose-500 text-rose-100 font-bold text-lg md:text-2xl py-4 rounded-[2rem] shadow-[0_8px_0_#be123c] border-4 border-white flex flex-col items-center gap-1">
                <span class="text-3xl md:text-4xl">🎆</span> Kembang Api
            </button>
            <button onclick="setMode('stars')" id="btn-stars"
                class="btn-mode flex-1 bg-purple-500 text-purple-100 font-bold text-lg md:text-2xl py-4 rounded-[2rem] shadow-[0_8px_0_#7e22ce] border-4 border-white flex flex-col items-center gap-1">
                <span class="text-3xl md:text-4xl">⭐</span> Bintang Jatuh
            </button>
        </div>
    </div>

    <script>
        // --- SISTEM SUARA (WEB AUDIO API) ---
        // Membuat efek suara sintesis tanpa file audio agar cepat dimuat
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Suara Gelembung Pecah (Pop)
        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            // Nada turun drastis meniru suara pop
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Suara Ledakan Kembang Api (Boom)
        function playBoomSound() {
            if (!audioCtx) return;
            // Menggunakan oscillator bernada sangat rendah (Thump)
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);

            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // Suara Bintang Gemerincing (Chime)
        function playChimeSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle';
            // Nada tinggi acak
            const freq = 1200 + Math.random() * 800;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- SETUP KANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // --- VARIABEL PERMAINAN ---
        let currentMode = 'bubbles'; // bubbles, fireworks, stars
        let entities = [];
        let isPointerDown = false;
        let lastPointerX = 0;
        let lastPointerY = 0;

        // --- FUNGSI GANTI MODE ---
        function setMode(mode) {
            currentMode = mode;
            entities = []; // Bersihkan layar

            // Atur gaya tombol aktif
            document.querySelectorAll('.btn-mode').forEach(btn => {
                btn.classList.remove('active-mode');
                btn.style.boxShadow = '';
            });

            const bgContainer = document.getElementById('bg-container');
            const btn = document.getElementById(`btn-${mode}`);
            btn.classList.add('active-mode');

            // Ubah Latar Belakang sesuai Mode
            if (mode === 'bubbles') {
                bgContainer.className = 'bg-cyan-200'; // Biru langit cerah
            } else if (mode === 'fireworks') {
                bgContainer.className = 'bg-slate-900'; // Langit malam gelap
            } else if (mode === 'stars') {
                bgContainer.className = 'bg-indigo-950'; // Ungu malam misterius
            }
        }

        // --- SISTEM PARTIKEL (ENTITAS) ---

        class Bubble {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.r = Math.random() * 20 + 20; // Radius 20-40
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() * -2) - 1; // Melayang ke atas
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.wobbleTime = Math.random() * Math.PI * 2;
                this.markedForDeletion = false;
            }
            update() {
                this.wobbleTime += this.wobbleSpeed;
                this.x += this.vx + Math.sin(this.wobbleTime) * 1.5; // Efek goyang
                this.y += this.vy;

                // Hapus jika keluar layar atas
                if (this.y + this.r < 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Gelembung transparan
                ctx.beginPath();
                ctx.arc(0, 0, this.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.stroke();

                // Pantulan cahaya (Highlight)
                ctx.beginPath();
                ctx.arc(-this.r * 0.3, -this.r * 0.3, this.r * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();

                ctx.restore();
            }
        }

        class FireworkRocket {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 15;

                const angle = Math.atan2(targetY - startY, targetX - startX);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;

                this.hue = Math.random() * 360;
                this.markedForDeletion = false;
                this.trail = [];
            }
            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;

                // Jika sudah dekat target, meledak
                const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                if (dist < this.speed || this.vy >= 0) {
                    this.markedForDeletion = true;
                    this.explode();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            explode() {
                playBoomSound();
                // Buat partikel percikan
                for (let i = 0; i < 40; i++) {
                    entities.push(new FireworkSpark(this.x, this.y, this.hue));
                }
            }
        }

        class FireworkSpark {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.hue = hue + (Math.random() * 40 - 20); // Variasi warna sedikit
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.markedForDeletion = false;
            }
            update() {
                this.vy += 0.2; // Gravitasi
                this.vx *= 0.95; // Gesekan udara
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.random() * 3 + 1, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        class Star {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 10;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.2;
                this.alpha = 1;
                this.color = ['#fde047', '#fef08a', '#ffffff', '#fbcfe8'][Math.floor(Math.random() * 4)];
                this.markedForDeletion = false;
            }
            update() {
                this.vy += 0.1; // Gravitasi ringan
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
                this.alpha -= 0.015;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.alpha;

                // Menggambar Bintang (5 sudut)
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    ctx.lineTo(Math.cos((18 + i * 72) / 180 * Math.PI) * this.size,
                        -Math.sin((18 + i * 72) / 180 * Math.PI) * this.size);
                    ctx.lineTo(Math.cos((54 + i * 72) / 180 * Math.PI) * (this.size / 2.5),
                        -Math.sin((54 + i * 72) / 180 * Math.PI) * (this.size / 2.5));
                }
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                // Glow efek
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.restore();
            }
        }

        // --- LOGIKA INTERAKSI (POINTER & TOUCH) ---

        function handleInteraction(x, y, type) {
            initAudio(); // Pastikan audio aktif

            if (currentMode === 'bubbles') {
                // Saat diklik/disentuh: Coba pecahkan gelembung, atau buat yang baru
                let popped = false;
                for (let i = entities.length - 1; i >= 0; i--) {
                    const b = entities[i];
                    if (b instanceof Bubble) {
                        const dist = Math.hypot(b.x - x, b.y - y);
                        if (dist < b.r + 15) { // +15 toleransi jari
                            b.markedForDeletion = true;
                            playPopSound();
                            popped = true;
                            // Munculkan percikan kecil
                            for (let j = 0; j < 5; j++) {
                                let spark = new FireworkSpark(b.x, b.y, 190);
                                spark.decay = 0.05;
                                entities.push(spark);
                            }
                            break; // Hanya pecahkan 1 per sentuhan
                        }
                    }
                }

                // Jika tidak mengenai gelembung, dan ini usapan (move) atau klik, buat gelembung baru
                if (!popped && (type === 'down' || Math.random() < 0.3)) {
                    entities.push(new Bubble(x, y));
                }

            } else if (currentMode === 'fireworks') {
                // Tembakkan kembang api dari bawah layar menuju titik sentuh
                if (type === 'down') {
                    entities.push(new FireworkRocket(x, height, x, y));
                }
            } else if (currentMode === 'stars') {
                // Taburkan bintang
                if (type === 'down' || type === 'move') {
                    if (Math.random() < 0.5) playChimeSound(); // Jangan terlalu bising
                    entities.push(new Star(x, y));
                }
            }
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            isPointerDown = true;
            handleInteraction(e.clientX, e.clientY, 'down');
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isPointerDown) return;
            handleInteraction(e.clientX, e.clientY, 'move');
        });
        window.addEventListener('mouseup', () => {
            isPointerDown = false;
        });

        // Touch Events (Untuk Mobile/Tablet)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isPointerDown = true;
            for (let i = 0; i < e.touches.length; i++) {
                handleInteraction(e.touches[i].clientX, e.touches[i].clientY, 'down');
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleInteraction(e.touches[i].clientX, e.touches[i].clientY, 'move');
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isPointerDown = false;
        });

        // --- GAME LOOP ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Kadang-kadang munculkan gelembung liar secara otomatis di mode Bubbles
            if (currentMode === 'bubbles' && Math.random() < 0.02 && entities.length < 30) {
                entities.push(new Bubble(Math.random() * width, height + 50));
            }

            // Update & Draw semua entitas
            for (let i = 0; i < entities.length; i++) {
                entities[i].update();
                entities[i].draw();
            }

            // Hapus yang ditandai untuk dihapus
            entities = entities.filter(e => !e.markedForDeletion);

            // Batasi jumlah partikel agar tidak lag
            if (entities.length > 200) {
                entities.splice(0, entities.length - 200);
            }

            requestAnimationFrame(animate);
        }

        // Mulai animasi
        window.onload = () => {
            animate();
        };

    </script>
</body>

</html>
