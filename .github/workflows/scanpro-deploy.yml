name: Deploy ScanPro to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'scanpro/**'
      - '.github/workflows/scanpro-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'scanpro-pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build ScanPro
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scanpro/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: scanpro

      - name: Run lint
        run: npm run lint
        working-directory: scanpro

      - name: Run typecheck
        run: npm run typecheck
        working-directory: scanpro

      - name: Run unit tests
        run: npm run test:run
        working-directory: scanpro

      - name: Build production bundle
        run: npm run build
        working-directory: scanpro

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -d dist/assets
          echo "Build verification passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanpro-dist
          path: scanpro/dist/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: scanpro-dist
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4