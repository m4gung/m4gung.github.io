<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstroMiner: Deep Space Idle</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --gold: #facc15;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #f43f5e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Left Panel (Mining Zone) */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .stats-card {
      text-align: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
    }

    .resource-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.2;
    }

    .sub-stats {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .clicker-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
    }

    .mine-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, #475569 0%, #1e293b 100%);
      border: 4px solid var(--accent);
      color: var(--text);
      font-size: 3rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      transition: transform 0.05s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mine-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
    }

    .prestige-box {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      text-align: center;
    }

    /* Right Panel (Upgrades Zone) */
    .panel h2 {
      font-size: 1.25rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 500px;
    }

    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .item-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .item-info p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    button.action-btn {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    button.action-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    button.action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--muted);
    }

    .btn-prestige {
      background: var(--gold);
      color: #000;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
    }

    .footer-tools {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: auto;
    }

    .text-link {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Area Tambang & Statistik -->
    <div class="panel">
      <div class="header-bar">
        <span style="font-weight: bold; letter-spacing: 0.5px;">ASTROMINER</span>
        <button class="audio-btn" id="audio-toggle">🔊 Audio: ON</button>
      </div>

      <div class="stats-card">
        <div class="resource-val" id="minerals">0</div>
        <div class="sub-stats">
          <span>Produksi Otomatis: <strong id="mps">0</strong>/dtk</span><br>
          <span>Multiplier Warp: <strong id="multiplier">1x</strong></span>
        </div>
      </div>

      <div class="clicker-box">
        <button class="mine-btn" id="mine-btn" title="Klik untuk menambang">☄️</button>
      </div>

      <div class="prestige-box">
        <h3>Warp Portal (Prestige)</h3>
        <p class="sub-stats" style="margin-bottom: 8px;">
          Reset tambang untuk <strong>Dark Matter</strong> (+10% multiplier permanen tiap unit).
        </p>
        <button class="action-btn btn-prestige" id="prestige-btn" disabled>
          Warp Jump (+0 Dark Matter)
        </button>
      </div>

      <div class="footer-tools">
        <span id="save-status">Saved</span>
        <button class="text-link" id="reset-btn">Reset Data</button>
      </div>
    </div>

    <!-- Area Upgrade & Automasi -->
    <div class="panel">
      <h2>Modul Upgrade Manual</h2>
      <div class="list" id="manual-upgrades"></div>

      <h2>Armada Drone & Automasi</h2>
      <div class="list" id="auto-upgrades"></div>
    </div>
  </div>

  <script>
    // --- Web Audio SFX Engine (Sci-Fi Synthesizer) ---
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Suara laser / impact saat klik asteroid
    function playLaserSound() {
      if (!audioEnabled) return;
      initAudio();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      // Pitch drop cepat khas senjata sci-fi / penambang laser
      const startFreq = 650 + Math.random() * 80;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    // Suara modul terpasang (nada dua tingkat bernuansa futuristik)
    function playUpgradeSound() {
      if (!audioEnabled) return;
      initAudio();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(880, now + 0.06);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(now + 0.18);
    }

    // Suara Warp Jump (Glissando panjang dengan bass sweep)
    function playWarpSound() {
      if (!audioEnabled) return;
      initAudio();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.6);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.3, now + 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(now + 0.7);
    }

    // --- State Game ---
    const DEFAULT_STATE = {
      minerals: 0,
      totalMineralsEarned: 0,
      clickPower: 1,
      darkMatter: 0,
      lastTick: Date.now(),
      manualLevels: [0, 0],
      autoLevels: [0, 0, 0, 0]
    };

    let game = loadGame();

    const manualConfig = [
      { name: "Laser Pickaxe", desc: "+1 mineral per klik", baseCost: 15, costScale: 1.15, power: 1 },
      { name: "Plasma Cutter", desc: "+5 mineral per klik", baseCost: 120, costScale: 1.18, power: 5 }
    ];

    const autoConfig = [
      { name: "Mining Drone", desc: "+1 mineral/dtk", baseCost: 20, costScale: 1.15, rate: 1 },
      { name: "Excavator Bot", desc: "+8 mineral/dtk", baseCost: 150, costScale: 1.15, rate: 8 },
      { name: "Solar Harvester", desc: "+45 mineral/dtk", baseCost: 1000, costScale: 1.17, rate: 45 },
      { name: "Orbital Platform", desc: "+250 mineral/dtk", baseCost: 7500, costScale: 1.20, rate: 250 }
    ];

    function getCost(baseCost, scale, level) {
      return Math.floor(baseCost * Math.pow(scale, level));
    }

    function getPrestigeMultiplier() {
      return 1 + (game.darkMatter * 0.1);
    }

    function getMPS() {
      let base = 0;
      autoConfig.forEach((cfg, idx) => {
        base += cfg.rate * (game.autoLevels[idx] || 0);
      });
      return base * getPrestigeMultiplier();
    }

    function getClickValue() {
      let base = 1;
      manualConfig.forEach((cfg, idx) => {
        base += cfg.power * (game.manualLevels[idx] || 0);
      });
      return base * getPrestigeMultiplier();
    }

    function getPrestigeClaim(total) {
      if (total < 50000) return 0;
      return Math.floor(Math.sqrt(total / 50000));
    }

    function formatNum(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
      return Math.floor(n).toLocaleString();
    }

    function buildUI() {
      const manualContainer = document.getElementById("manual-upgrades");
      manualContainer.innerHTML = manualConfig.map((cfg, idx) => `
        <div class="item-card">
          <div class="item-info">
            <h4 id="man-name-${idx}">${cfg.name} (Lvl ${game.manualLevels[idx] || 0})</h4>
            <p>${cfg.desc}</p>
          </div>
          <button class="action-btn" id="man-btn-${idx}" onclick="buyManual(${idx})"></button>
        </div>
      `).join("");

      const autoContainer = document.getElementById("auto-upgrades");
      autoContainer.innerHTML = autoConfig.map((cfg, idx) => `
        <div class="item-card">
          <div class="item-info">
            <h4 id="auto-name-${idx}">${cfg.name} (Lvl ${game.autoLevels[idx] || 0})</h4>
            <p>${cfg.desc}</p>
          </div>
          <button class="action-btn" id="auto-btn-${idx}" onclick="buyAuto(${idx})"></button>
        </div>
      `).join("");
    }

    function updateUI() {
      document.getElementById("minerals").textContent = formatNum(game.minerals);
      document.getElementById("mps").textContent = formatNum(getMPS());
      document.getElementById("multiplier").textContent = getPrestigeMultiplier().toFixed(1) + "x";

      manualConfig.forEach((cfg, idx) => {
        const cost = getCost(cfg.baseCost, cfg.costScale, game.manualLevels[idx] || 0);
        const btn = document.getElementById(`man-btn-${idx}`);
        const nameLabel = document.getElementById(`man-name-${idx}`);
        nameLabel.textContent = `${cfg.name} (Lvl ${game.manualLevels[idx] || 0})`;
        btn.textContent = `${formatNum(cost)} Min`;
        btn.disabled = game.minerals < cost;
      });

      autoConfig.forEach((cfg, idx) => {
        const cost = getCost(cfg.baseCost, cfg.costScale, game.autoLevels[idx] || 0);
        const btn = document.getElementById(`auto-btn-${idx}`);
        const nameLabel = document.getElementById(`auto-name-${idx}`);
        nameLabel.textContent = `${cfg.name} (Lvl ${game.autoLevels[idx] || 0})`;
        btn.textContent = `${formatNum(cost)} Min`;
        btn.disabled = game.minerals < cost;
      });

      const currentClaim = getPrestigeClaim(game.totalMineralsEarned);
      const pendingReward = Math.max(0, currentClaim - game.darkMatter);
      const prestigeBtn = document.getElementById("prestige-btn");
      prestigeBtn.textContent = `Warp Jump (+${pendingReward} Dark Matter)`;
      prestigeBtn.disabled = pendingReward <= 0;
    }

    // --- Action Handlers dengan Audio ---
    function mineAsteroid() {
      playLaserSound();
      const earned = getClickValue();
      game.minerals += earned;
      game.totalMineralsEarned += earned;
      updateUI();
    }

    function buyManual(idx) {
      const cost = getCost(manualConfig[idx].baseCost, manualConfig[idx].costScale, game.manualLevels[idx]);
      if (game.minerals >= cost) {
        playUpgradeSound();
        game.minerals -= cost;
        game.manualLevels[idx]++;
        updateUI();
      }
    }

    function buyAuto(idx) {
      const cost = getCost(autoConfig[idx].baseCost, autoConfig[idx].costScale, game.autoLevels[idx]);
      if (game.minerals >= cost) {
        playUpgradeSound();
        game.minerals -= cost;
        game.autoLevels[idx]++;
        updateUI();
      }
    }

    function prestige() {
      const currentClaim = getPrestigeClaim(game.totalMineralsEarned);
      const pending = currentClaim - game.darkMatter;
      if (pending <= 0) return;

      if (confirm(`Melakukan Warp Jump akan mengulang mineral dan armada Anda untuk +${pending} Dark Matter (+${pending * 10}% multiplier permanen). Lanjutkan?`)) {
        playWarpSound();
        game.darkMatter += pending;
        game.minerals = 0;
        game.manualLevels = manualConfig.map(() => 0);
        game.autoLevels = autoConfig.map(() => 0);
        buildUI();
        updateUI();
        saveGame();
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById("audio-toggle").textContent = audioEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
    }

    function tick() {
      const now = Date.now();
      const deltaSec = (now - game.lastTick) / 1000;
      game.lastTick = now;

      if (deltaSec > 0) {
        const generated = getMPS() * deltaSec;
        game.minerals += generated;
        game.totalMineralsEarned += generated;
      }

      updateUI();
    }

    function saveGame() {
      localStorage.setItem("astro_miner_save", JSON.stringify(game));
      const status = document.getElementById("save-status");
      status.textContent = "Saved";
      setTimeout(() => { status.textContent = ""; }, 1200);
    }

    function loadGame() {
      const raw = localStorage.getItem("astro_miner_save");
      if (!raw) return { ...DEFAULT_STATE };
      try {
        const parsed = JSON.parse(raw);
        const elapsedSec = (Date.now() - (parsed.lastTick || Date.now())) / 1000;
        const loaded = { ...DEFAULT_STATE, ...parsed };
        
        if (elapsedSec > 5) {
          const validSec = Math.min(elapsedSec, 86400);
          let offlineMPS = 0;
          autoConfig.forEach((cfg, idx) => {
            offlineMPS += cfg.rate * (loaded.autoLevels[idx] || 0);
          });
          const mult = 1 + (loaded.darkMatter * 0.1);
          const offlineGain = offlineMPS * mult * validSec;
          
          loaded.minerals += offlineGain;
          loaded.totalMineralsEarned += offlineGain;
          alert(`Selamat datang kembali!\nArmada Anda menambang ${formatNum(offlineGain)} mineral saat Anda offline.`);
        }
        loaded.lastTick = Date.now();
        return loaded;
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }

    function hardReset() {
      if (confirm("Yakin ingin menghapus seluruh progress dan mulai dari nol?")) {
        localStorage.removeItem("astro_miner_save");
        game = { ...DEFAULT_STATE, lastTick: Date.now() };
        buildUI();
        updateUI();
      }
    }

    // --- Init Event Listeners ---
    document.getElementById("mine-btn").addEventListener("click", mineAsteroid);
    document.getElementById("prestige-btn").addEventListener("click", prestige);
    document.getElementById("reset-btn").addEventListener("click", hardReset);
    document.getElementById("audio-toggle").addEventListener("click", toggleAudio);

    buildUI();
    updateUI();

    setInterval(tick, 100);
    setInterval(saveGame, 15000);
  </script>
</body>
</html>
