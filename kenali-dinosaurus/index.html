    <title>Kenali Dinosaurus - Game Edukasi Anak</title>

    <!-- Font lucu untuk anak-anak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'fredoka': ['"Fredoka One"', 'cursive'],
                    },
                    colors: {
                        dino: {
                            trex: '#EF4444',     // Red
                            bronto: '#10B981',   // Green
                            trice: '#F97316',    // Orange
                            stego: '#8B5CF6',    // Purple
                            ptera: '#3B82F6',    // Blue
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(180deg, #FEF08A 0%, #BBF7D0 50%, #BAE6FD 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animasi Mengambang (Idle) */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        /* Animasi Melompat dan Membesar saat diklik */
        @keyframes jump {
            0% {
                transform: translateY(0) scale(1);
            }

            40% {
                transform: translateY(-25px) scale(1.15) rotate(-5deg);
            }

            60% {
                transform: translateY(-25px) scale(1.15) rotate(5deg);
            }

            100% {
                transform: translateY(0) scale(1);
            }
        }

        .animate-jump {
            animation: jump 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bayangan teks yang ramah anak */
        .text-shadow-sm {
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .text-shadow-lg {
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.15);
        }

        /* Tombol 3D bergaya game */
        .btn-3d {
            transition: all 0.1s;
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 currentcolor;
        }
    </style>
</head>

        let isSpeaking = false;

        // Fungsi Memulai Permainan
        function startGame() {
            // Sembunyikan layar mulai
            const startScreen = document.getElementById('start-screen');
            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('main-screen').classList.add('flex');
            }, 500);

            // Render Kartu Dinosaurus
            renderDinos();

            // Pancing Audio API dan Sapa Anak
            speakText("Halo! Ayo belajar nama-nama dinosaurus! Klik hewannya untuk mendengar namanya.");
        }

        // Fungsi Render Kartu
        function renderDinos() {
            const gallery = document.getElementById('dino-gallery');
            gallery.innerHTML = '';

            dinos.forEach((dino, index) => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-[2rem] p-4 flex flex-col items-center justify-center border-4 border-white drop-shadow-xl cursor-pointer hover:-translate-y-2 transition-transform duration-200 group`;

                // Isi Kartu
                card.innerHTML = `
                    <!-- Container Dino dengan Warna Latar -->
                    <div id="dino-img-${index}" class="w-full aspect-square ${dino.color} rounded-[1.5rem] p-6 flex items-center justify-center relative overflow-hidden animate-float" style="animation-delay: ${index * 0.2}s">
                        <!-- Pola Latar Belakang Lingkaran Transparan -->
                        <div class="absolute inset-0 opacity-20">
                            <div class="absolute w-16 h-16 bg-white rounded-full -top-4 -left-4"></div>
                            <div class="absolute w-24 h-24 bg-white rounded-full -bottom-8 -right-8"></div>
                        </div>
                        
                        <!-- Gambar SVG Dino -->
                        <div class="relative z-10 w-full h-full transform transition-transform group-hover:scale-110">
                            ${dino.svg}
                        </div>
                    </div>

                    <!-- Judul Nama -->
                    <h2 class="text-3xl md:text-4xl font-fredoka text-gray-700 mt-6 mb-4 text-center">
                        ${dino.name}
                    </h2>

                    <!-- Tombol Speaker -->
                    <button class="btn-3d w-full bg-yellow-400 text-gray-800 font-bold py-3 px-6 rounded-full ${dino.shadow} flex items-center justify-center gap-2 border-2 border-transparent">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white drop-shadow-md" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                        </svg>
                        <span class="text-xl font-fredoka text-white text-shadow-sm">Dengarkan</span>
                    </button>
                `;

                // Event Listener saat kartu diklik
                card.onclick = () => playDinoInteraction(index, dino.speech);

                gallery.appendChild(card);
            });
        }

        // Fungsi Interaksi saat Dino diklik
        function playDinoInteraction(index, textToSpeak) {
            const dinoImgContainer = document.getElementById(`dino-img-${index}`);

            // Hapus class lompat jika sedang berjalan, lalu tambahkan ulang agar bisa diklik berulang kali
            dinoImgContainer.classList.remove('animate-jump');

            // Trigger reflow agar animasi bisa restart
            void dinoImgContainer.offsetWidth;

            // Tambahkan animasi melompat
            dinoImgContainer.classList.add('animate-jump');

            // Ucapkan suara
            speakText(textToSpeak);
        }

        // Fungsi Teks ke Suara (Web Speech API)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // Hentikan suara yang sedang berjalan agar tidak bertumpuk
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID'; // Bahasa Indonesia
                utterance.rate = 0.85;    // Lebih lambat sedikit agar mudah dipahami anak
                utterance.pitch = 1.3;    // Nada suara agak tinggi agar terdengar bersahabat

                window.speechSynthesis.speak(utterance);
            } else {
                console.warn("Browser tidak mendukung Web Speech API");
            }
        }
    </script>
