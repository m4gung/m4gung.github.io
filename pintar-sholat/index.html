<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Sholat - 17 Rukun</title>

    <!-- Menggunakan font Quicksand untuk Latin dan font serif standar/Amiri untuk teks Arab -->
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Quicksand:wght@500;700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Quicksand', 'sans-serif'],
                        'arabic': ['Amiri', 'serif'],
                    },
                    colors: {
                        pastel: {
                            green: '#d1fae5', /* hijau muda lembut */
                            darkgreen: '#065F46',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            transition: background-color 0.5s ease;
            background-color: #ecfdf5;
            /* Background hijau sangat muda */
        }

        .btn-bouncy {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.1);
        }

        .btn-bouncy:active:not(:disabled) {
            transform: translateY(6px) scale(0.95);
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.1);
        }

        .btn-bouncy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes pop {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            70% {
                transform: scale(1.02);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .arabic-text {
            direction: rtl;
            line-height: 1.8;
        }

        /* Styling scrollbar untuk card jika konten terlalu panjang */
        .card-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .card-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .card-scroll::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen text-gray-800 flex flex-col font-sans overflow-hidden">

    <div class="max-w-2xl mx-auto px-4 py-4 flex flex-col h-screen w-full relative">

        <header class="text-center mb-4 z-10 shrink-0">

                🕌 Belajar Rukun Sholat
            </h1>
            <p
                class="text-sm md:text-base font-bold text-emerald-600 bg-emerald-100 inline-block px-4 py-1 rounded-full shadow-sm border border-emerald-200">
                17 Rukun Mazhab Syafi'i 🌟
            </p>
        </header>

        <main id="mode-learn" class="flex-1 flex flex-col z-10 w-full min-h-0 relative">

            <!-- Flashcard Container (Scrollable jika teks panjang) -->
            <div id="flashcard"
                class="bg-white rounded-[2rem] p-5 md:p-6 shadow-lg border-4 border-emerald-200 flex-1 flex flex-col items-center text-center max-w-lg mx-auto w-full transition-transform card-scroll overflow-y-auto mb-4 relative">

                <!-- Indikator Angka -->
                <div id="step-badge"

                    1
                </div>

                <!-- Gambar/Ilustrasi -->
                <div class="mt-8 mb-4 w-full flex justify-center shrink-0">
                    <img id="fc-img" src="https://placehold.co/400x400/D1FAE5/065F46?text=Animasi+Niat" alt="Ilustrasi"
                        class="w-40 h-40 md:w-48 md:h-48 object-cover rounded-3xl border-4 border-emerald-100 shadow-sm animate-pulse-once">
                </div>

                <!-- Judul Rukun & Penjelasan -->
                <h2 id="fc-title" class="text-2xl md:text-3xl font-black text-emerald-700 mb-2">Niat</h2>
                <p id="fc-desc" class="text-base md:text-lg text-gray-600 font-bold mb-4 px-2">
                    Menyengaja di dalam hati untuk melakukan ibadah sholat.


                </p>

                <!-- Bagian Bacaan (Bisa disembunyikan jika rukun tidak ada bacaan) -->
                <div id="fc-reading-box" class="w-full flex flex-col gap-3 my-2 shrink-0 ">

                    <p id="fc-arabic"
                        class="font-arabic arabic-text  text-emerald-800 font-bold text-2xl md:text-3xl !leading-[2] md:!leading-[2]">
                        Arab</p>

                    <div class="bg-gray-50 p-4 rounded-2xl border-2 border-gray-200">
                        <p id="fc-latin" class="text-lg md:text-xl text-gray-700 font-bold mb-2 italic">Latin</p>
                        <p id="fc-meaning" class="text-sm md:text-base text-gray-500 font-medium">Arti</p>
                    </div>
                </div>

            </div>

            <!-- Navigation Buttons (Fixed at bottom) -->
            <div class="shrink-0 flex justify-between items-center max-w-lg mx-auto w-full gap-3 pb-4">
                <button id="btn-prev" onclick="changeCard(-1)"
                    class="flex-1 bg-white text-emerald-600 border-4 border-emerald-200 py-3 rounded-2xl font-bold text-base md:text-lg btn-bouncy flex justify-center items-center">
                    ⬅️ Mundur
                </button>

                <button onclick="readCurrentCard()"

                    🔊
                </button>

                <button id="btn-next" onclick="changeCard(1)"
                    class="flex-1 bg-emerald-500 text-white border-4 border-emerald-600 py-3 rounded-2xl font-bold text-base md:text-lg btn-bouncy flex justify-center items-center">
                    Maju ➡️
                </button>
            </div>
        </main>
    </div>

        let currentStepIndex = 0;

        function speak(text, callback = null) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = 1.3; // Suara lebih ramah untuk anak
            utterance.rate = 0.9;  // Biraz lambat agar artikulasi jelas
            if (callback) utterance.onend = callback;
            window.speechSynthesis.speak(utterance);
        }

        function getImageUrl(text) {
            // Encode teks agar valid untuk URL placehold.co
            const encoded = encodeURIComponent(text);
            return `${encoded}`;
        }

        function updateFlashcardUI() {
            const data = sholatSequence[currentStepIndex];
            const card = document.getElementById('flashcard');

            // Animasi transisi
            card.classList.remove('animate-pop');
            void card.offsetWidth;
            card.classList.add('animate-pop');

            // Update Teks Dasar & Gambar
            document.getElementById('step-badge').textContent = data.id;
            document.getElementById('fc-title').textContent = data.title;
            document.getElementById('fc-desc').innerHTML = "";
            data.desc.split('\n').forEach((baris, indeks) => {
                if (indeks > 0) {
                    document.getElementById('fc-desc').appendChild(document.createElement('br')); // Tambah <br> antar baris
                }
                document.getElementById('fc-desc').appendChild(document.createTextNode(baris)); // Tambah teksnya
            });


            document.getElementById('fc-img').src = data.imgText;

            // Update Kotak Bacaan (Tampil jika ada, Sembunyi jika tidak)
            const readingBox = document.getElementById('fc-reading-box');
            if (data.arabic) {
                readingBox.classList.remove('hidden');
                document.getElementById('fc-arabic').textContent = data.arabic;
                document.getElementById('fc-latin').textContent = `"${data.latin}"`;
                document.getElementById('fc-meaning').textContent = `Artinya: ${data.meaning}`;
            } else {
                readingBox.classList.add('hidden');
            }

            // Atur ketersediaan Tombol Navigasi
            document.getElementById('btn-prev').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').disabled = currentStepIndex === sholatSequence.length - 1;

            // Gulir otomatis kembali ke atas jika teks sebelumnya panjang
            card.scrollTop = 0;
        }

        function changeCard(direction) {
            window.speechSynthesis.cancel();
            const newIndex = currentStepIndex + direction;
            if (newIndex >= 0 && newIndex < sholatSequence.length) {
                currentStepIndex = newIndex;
                updateFlashcardUI();

                // Opsional: Langsung membacakan saat halaman berganti (Bisa di-uncomment jika ingin otomatis bicara)
                // readCurrentCard(); 
            }
        }

        function readCurrentCard() {
            const data = sholatSequence[currentStepIndex];

            // Merangkai kalimat untuk asisten suara
            let textToRead = `Nomor ${data.id}. ${data.title}. ${data.desc}`;

            if (data.latin) {
                textToRead += ` Bacaannya adalah: ${data.latin}. Artinya: ${data.meaning}.`;
            }

            speak(textToRead);
        }

        // Inisialisasi saat aplikasi dimuat pertama kali
        window.onload = () => {
            updateFlashcardUI();
        };

</body>
