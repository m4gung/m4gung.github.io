<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Warna</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'display': ['Fredoka One', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* Latar belakang ceria menggunakan warna pastel */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px), radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            min-height: 100vh;
            overflow-x: hidden;
            color: #334155;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animasi Membal (Pop) */
        @keyframes pop {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.15) translateY(-10px);
            }

            60% {
                transform: scale(0.95) translateY(5px);
            }

            100% {
                transform: scale(1) translateY(0);
            }
        }

        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Animasi Bergetar (Shake) untuk jawaban salah */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px) rotate(-5deg);
            }

            75% {
                transform: translateX(10px) rotate(5deg);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Animasi Mengambang untuk menu */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        /* Tombol 3D */
        .btn-3d {
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-3d:active {
            transform: translateY(8px) !important;
            box-shadow: 0 0px 0 0 currentcolor !important;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="flex flex-col items-center no-select pb-12">

    <!-- SCREEN: MENU UTAMA -->
    <div id="screen-menu"
        class="w-full max-w-2xl flex flex-col items-center justify-center min-h-screen p-6 text-center transition-all duration-300">
        <div
            class="bg-white/95 backdrop-blur-md p-8 md:p-12 rounded-[3rem] shadow-2xl border-8 border-white w-full animate-float">
            <h1 class="font-display text-5xl md:text-6xl text-pink-500 mb-4 drop-shadow-sm leading-tight">
                Pintar Warna! 🎨
            </h1>
            <p class="text-2xl text-gray-600 mb-10 font-bold">Ayo bermain dan belajar!</p>

            <div class="flex flex-col md:flex-row justify-center gap-6">
                <!-- Tombol Belajar -->
                <button onclick="goToLearn()"
                    class="btn-3d flex-1 bg-sky-200 hover:bg-sky-300 text-gray-800 text-3xl font-black py-8 px-6 rounded-[2.5rem] shadow-[0_10px_0_#7dd3fc] border-4 border-white flex flex-col items-center justify-center gap-3">
                    <span class="text-6xl mb-2 drop-shadow-md">📖</span>
                    Belajar Warna
                </button>
                <!-- Tombol Bermain -->
                <button onclick="goToGame()"
                    class="btn-3d flex-1 bg-yellow-200 hover:bg-yellow-300 text-gray-800 text-3xl font-black py-8 px-6 rounded-[2.5rem] shadow-[0_10px_0_#fde047] border-4 border-white flex flex-col items-center justify-center gap-3">
                    <span class="text-6xl mb-2 drop-shadow-md">🎯</span>
                    Bermain Warna
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN: BELAJAR WARNA -->
    <div id="screen-learn" class="hidden w-full max-w-5xl flex-col items-center pt-8 px-4">
        <header class="w-full flex items-center justify-between mb-8 max-w-4xl">
            <button onclick="goToMenu()"
                class="btn-3d bg-white text-gray-600 font-bold text-xl py-3 px-8 rounded-full shadow-[0_6px_0_#cbd5e1] border-4 border-white flex items-center gap-2">
                <span>⬅️</span> Kembali
            </button>
            <h2
                class="font-display text-3xl text-white bg-sky-400 px-8 py-3 rounded-full border-4 border-white shadow-lg">
                Kenali Warna</h2>
        </header>

        <!-- Grid Warna -->
        <div id="learn-grid"
            class="grid grid-cols-2 md:grid-cols-5 gap-6 w-full max-w-4xl bg-white/90 p-8 rounded-[3rem] border-8 border-white shadow-2xl">
            <!-- Diisi oleh JS -->
        </div>
    </div>

    <!-- SCREEN: GAME WARNA -->
    <div id="screen-game" class="hidden w-full max-w-4xl flex-col items-center pt-8 px-4">
        <header class="w-full flex items-center justify-between mb-8 max-w-3xl">
            <button onclick="goToMenu()"
                class="btn-3d bg-white text-gray-600 font-bold text-xl py-3 px-8 rounded-full shadow-[0_6px_0_#cbd5e1] border-4 border-white flex items-center gap-2">
                <span>⬅️</span> Kembali
            </button>
            <h2
                class="font-display text-3xl text-white bg-yellow-400 px-8 py-3 rounded-full border-4 border-white shadow-lg">
                Tebak Warna</h2>
        </header>

        <div
            class="bg-white/95 p-8 md:p-12 rounded-[3rem] shadow-2xl border-8 border-white w-full max-w-3xl text-center flex flex-col items-center">

            <div class="bg-indigo-50 px-8 py-4 rounded-[2rem] border-4 border-indigo-100 w-full mb-8">
                <p class="text-2xl text-gray-600 font-bold mb-2">Temukan warna:</p>
                <div class="flex items-center justify-center gap-4">
                    <h1 id="game-question"
                        class="font-display text-5xl md:text-6xl text-indigo-500 drop-shadow-sm capitalize">Merah</h1>
                    <button onclick="repeatQuestion()"
                        class="btn-3d bg-yellow-300 text-yellow-900 font-bold p-4 rounded-full shadow-[0_6px_0_#eab308] border-4 border-white text-2xl"
                        title="Dengarkan lagi">
                        🔊
                    </button>
                </div>
            </div>

            <div id="game-options" class="flex justify-center gap-6 md:gap-10 w-full flex-wrap mb-4">
                <!-- Diisi oleh JS -->
            </div>

            <div id="game-feedback"
                class="mt-4 text-3xl font-display h-10 transition-all flex items-center justify-center w-full"></div>
        </div>
    </div>

    <script>
        // Data 10 Warna Dasar
        const colorsData = [
            { id: 'merah', name: 'Merah', bg: 'bg-red-500', shadow: 'shadow-[0_10px_0_#b91c1c]', border: 'border-white' },
            { id: 'biru', name: 'Biru', bg: 'bg-blue-500', shadow: 'shadow-[0_10px_0_#1d4ed8]', border: 'border-white' },
            { id: 'kuning', name: 'Kuning', bg: 'bg-yellow-400', shadow: 'shadow-[0_10px_0_#a16207]', border: 'border-white' },
            { id: 'hijau', name: 'Hijau', bg: 'bg-green-500', shadow: 'shadow-[0_10px_0_#15803d]', border: 'border-white' },
            { id: 'oranye', name: 'Oranye', bg: 'bg-orange-500', shadow: 'shadow-[0_10px_0_#c2410c]', border: 'border-white' },
            { id: 'ungu', name: 'Ungu', bg: 'bg-purple-500', shadow: 'shadow-[0_10px_0_#7e22ce]', border: 'border-white' },
            { id: 'merah_muda', name: 'Merah Muda', bg: 'bg-pink-400', shadow: 'shadow-[0_10px_0_#be185d]', border: 'border-white' },
            { id: 'cokelat', name: 'Cokelat', bg: 'bg-amber-800', shadow: 'shadow-[0_10px_0_#78350f]', border: 'border-white' },
            { id: 'hitam', name: 'Hitam', bg: 'bg-gray-900', shadow: 'shadow-[0_10px_0_#000000]', border: 'border-white' },
            { id: 'putih', name: 'Putih', bg: 'bg-white', shadow: 'shadow-[0_10px_0_#cbd5e1]', border: 'border-gray-200' }
        ];

        let currentTarget = null;
        let isWaitingForNext = false;

        // Fungsi Text-to-Speech
        function speak(text, callback = null) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85; // Sedikit lebih lambat agar jelas
            utterance.pitch = 1.2; // Nada agak tinggi (ceria)

            if (callback) {
                utterance.onend = callback;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Fungsi Navigasi Layar
        function hideAllScreens() {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('flex');
            document.getElementById('screen-learn').classList.add('hidden');
            document.getElementById('screen-learn').classList.remove('flex');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('flex');
        }

        function goToMenu() {
            hideAllScreens();
            const el = document.getElementById('screen-menu');
            el.classList.remove('hidden');
            el.classList.add('flex');
            window.speechSynthesis.cancel();
        }

        function goToLearn() {
            hideAllScreens();
            const el = document.getElementById('screen-learn');
            el.classList.remove('hidden');
            el.classList.add('flex');

            speak("Ayo belajar warna. Klik warnanya!");
            renderLearnGrid();
        }

        function renderLearnGrid() {
            const grid = document.getElementById('learn-grid');
            grid.innerHTML = '';

            colorsData.forEach(color => {
                const btn = document.createElement('button');
                // Khusus untuk warna terang, teksnya jadi gelap, selainnya putih
                const textColor = (color.id === 'putih' || color.id === 'kuning') ? 'text-gray-800' : 'text-white';

                btn.className = `btn-3d w-full aspect-square rounded-3xl border-4 ${color.border} ${color.bg} ${color.shadow} flex items-center justify-center flex-col gap-2`;
                btn.innerHTML = `<span class="font-display text-xl md:text-2xl ${textColor}">${color.name}</span>`;

                btn.onclick = () => {
                    // Reset animasi pop
                    btn.classList.remove('animate-pop');
                    void btn.offsetWidth; // Trigger reflow
                    btn.classList.add('animate-pop');
                    speak(color.name);
                };

                grid.appendChild(btn);
            });
        }

        function goToGame() {
            hideAllScreens();
            const el = document.getElementById('screen-game');
            el.classList.remove('hidden');
            el.classList.add('flex');

            isWaitingForNext = false;
            generateGameRound();
        }

        function generateGameRound() {
            isWaitingForNext = false;
            const fb = document.getElementById('game-feedback');
            fb.innerText = "";
            fb.className = "mt-4 text-3xl font-display h-10 transition-all flex items-center justify-center w-full";

            // Pilih 1 warna target yang benar
            currentTarget = colorsData[Math.floor(Math.random() * colorsData.length)];

            // Pilih 2 warna salah yang berbeda
            let options = [currentTarget];
            while (options.length < 3) {
                let randomColor = colorsData[Math.floor(Math.random() * colorsData.length)];
                if (!options.find(o => o.id === randomColor.id)) {
                    options.push(randomColor);
                }
            }

            // Acak posisi pilihan
            options.sort(() => 0.5 - Math.random());

            // Update UI Pertanyaan
            document.getElementById('game-question').innerText = currentTarget.name;

            // Render Pilihan
            const container = document.getElementById('game-options');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `btn-3d w-28 h-28 md:w-36 md:h-36 rounded-3xl border-[6px] ${opt.border} ${opt.bg} ${opt.shadow}`;

                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });

            repeatQuestion();
        }

        function repeatQuestion() {
            if (currentTarget) {
                speak(`Temukan warna ${currentTarget.name}`);
            }
        }

        function checkAnswer(selectedColor, btn) {
            if (isWaitingForNext) return; // Cegah spam klik saat transisi

            const fb = document.getElementById('game-feedback');

            if (selectedColor.id === currentTarget.id) {
                isWaitingForNext = true;
                btn.classList.add('animate-pop');
                fb.innerText = "Yey! Pintar Sekali! 🎉";
                fb.className = "mt-4 text-3xl font-display h-10 text-green-500 animate-pop flex items-center justify-center w-full";

                speak(`Pintar! Itu warna ${currentTarget.name}`, () => {
                    setTimeout(generateGameRound, 1000);
                });
            } else {
                btn.classList.remove('animate-shake');
                void btn.offsetWidth;
                btn.classList.add('animate-shake');

                fb.innerText = "Ups! Coba lagi 🤔";
                fb.className = "mt-4 text-3xl font-display h-10 text-red-500 animate-pop flex items-center justify-center w-full";
                speak("Ups, coba lagi");
            }
        }
    </script>
</body>

</html>
