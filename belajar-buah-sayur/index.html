<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Buah dan Sayur</title>

    <!-- Memuat Font Ramah Anak -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Konfigurasi Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            red: '#ffb3ba',
                            orange: '#ffdfba',
                            yellow: '#ffffba',
                            green: '#baffc9',
                            blue: '#bae1ff',
                            purple: '#e8baff'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Mencegah highlight biru saat anak-anak menyentuh layar berturut-turut */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        /* Animasi Tombol Membal (Bouncy) */
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.1);
        }

        .btn-bouncy:active {
            transform: translateY(6px) scale(0.95);
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.1);
        }

        /* Animasi Pop saat item ditekan di mode belajar */
        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: pop 0.4s ease-out;
        }

        /* Animasi Bergetar (Shake) untuk jawaban salah */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-10px);
            }

            40%,
            80% {
                transform: translateX(10px);
            }
        }

        .animate-shake {
            animation: shake 0.5s;
        }

        /* Animasi mengambang untuk awan/dekorasi */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-pastel-yellow min-h-screen text-gray-800 overflow-x-hidden">

    <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col min-h-screen">

        <!-- Header & Navigasi -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-rose-500 mb-6 drop-shadow-sm animate-float">
                🍏 Pintar Buah & Sayur 🥕
            </h1>

            <div class="flex justify-center gap-4 bg-white/50 p-2 rounded-full shadow-sm max-w-sm mx-auto">
                <button onclick="switchMode('learn')" id="btn-mode-learn"
                    class="flex-1 py-3 px-4 rounded-full font-bold text-lg bg-blue-400 text-white shadow-[0_4px_0_#2563eb] transition-all btn-bouncy">
                    Belajar
                </button>
                <button onclick="switchMode('play')" id="btn-mode-play"
                    class="flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all">
                    Bermain
                </button>
            </div>
        </header>

        <main id="mode-learn" class="flex-1 flex flex-col">
            <div class="text-center mb-6">
                <p class="text-xl font-bold text-gray-600 bg-white inline-block px-6 py-2 rounded-full shadow-sm">
                    Sentuh gambarnya untuk mendengarkan! 👇
                </p>
            </div>
            <!-- Grid untuk daftar buah dan sayur (diisi oleh JS) -->
            <div id="learn-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 pb-10">
                <!-- Item cards di-generate otomatis -->
            </div>
        </main>

        <main id="mode-play" class="flex-1 flex flex-col hidden pb-10">
            <!-- Papan Skor -->
            <div
                class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border-4 border-rose-200">
                <div class="text-xl font-black text-rose-500 flex items-center gap-2">
                    <span>⭐ Pintar:</span>
                    <span id="score-display" class="text-2xl">0</span>
                </div>
                <button onclick="repeatRiddle()"
                    class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-xl font-bold btn-bouncy flex items-center gap-2 border-2 border-white shadow-sm">
                    🔊 Ulangi Suara
                </button>
            </div>

            <!-- Area Pertanyaan (Tebak-tebakan) -->
            <div
                class="bg-white p-6 md:p-10 rounded-[2rem] shadow-lg text-center mb-8 border-b-8 border-rose-200 flex-1 flex flex-col justify-center">
                <p id="riddle-text" class="text-2xl md:text-4xl font-bold text-gray-700 leading-snug">
                    Memuat tebakan...
                </p>
            </div>

            <!-- Area Pilihan Ganda -->
            <div id="options-container" class="grid grid-cols-3 gap-4">
                <!-- Tombol pilihan di-generate otomatis -->
            </div>
        </main>

    </div>

    <script>
        // Data Buah dan Sayur
        const dataItems = [
            { id: 'apel', name: 'Apel', emoji: '🍎', color: 'merah', bgClass: 'bg-pastel-red', riddle: 'Aku buah berwarna merah, rasanya manis dan renyah. Siapakah aku?' },
            { id: 'pisang', name: 'Pisang', emoji: '🍌', color: 'kuning', bgClass: 'bg-pastel-yellow', riddle: 'Aku buah berwarna kuning. Aku sangat disukai monyet. Siapakah aku?' },
            { id: 'jeruk', name: 'Jeruk', emoji: '🍊', color: 'oranye', bgClass: 'bg-pastel-orange', riddle: 'Aku buah berwarna oranye, bentukku bulat dan kaya vitamin C. Siapakah aku?' },
            { id: 'anggur', name: 'Anggur', emoji: '🍇', color: 'ungu', bgClass: 'bg-pastel-purple', riddle: 'Aku buah berukuran kecil, berkelompok, dan berwarna ungu. Siapakah aku?' },
            { id: 'wortel', name: 'Wortel', emoji: '🥕', color: 'oranye', bgClass: 'bg-pastel-orange', riddle: 'Aku sayuran panjang berwarna oranye. Kelinci sangat suka memakan aku! Siapakah aku?' },
            { id: 'brokoli', name: 'Brokoli', emoji: '🥦', color: 'hijau', bgClass: 'bg-pastel-green', riddle: 'Aku sayuran berwarna hijau, bentukku mirip seperti pohon kecil. Siapakah aku?' },
            { id: 'tomat', name: 'Tomat', emoji: '🍅', color: 'merah', bgClass: 'bg-pastel-red', riddle: 'Aku sayuran bulat dan merah, sering dipakai untuk membuat saus. Siapakah aku?' },
            { id: 'terong', name: 'Terong', emoji: '🍆', color: 'ungu', bgClass: 'bg-pastel-purple', riddle: 'Aku sayuran berbentuk lonjong dan berwarna ungu. Siapakah aku?' }
        ];

        // State Aplikasi
        let currentMode = 'learn';
        let score = 0;
        let currentCorrectItem = null;
        let isSpeaking = false;

        // Inisialisasi Elemen
        const learnGrid = document.getElementById('learn-grid');
        const optionsContainer = document.getElementById('options-container');
        const riddleText = document.getElementById('riddle-text');
        const scoreDisplay = document.getElementById('score-display');

        function speak(text, callback = null) {
            // Hentikan suara sebelumnya jika ada
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = 1.3; // Nada lebih tinggi agar ramah untuk anak-anak
            utterance.rate = 0.9;  // Sedikit lebih lambat agar jelas

            utterance.onend = () => {
                if (callback) callback();
            };

            window.speechSynthesis.speak(utterance);
        }

        function renderLearnMode() {
            learnGrid.innerHTML = '';
            dataItems.forEach((item, index) => {
                const card = document.createElement('button');
                // Desain kartu untuk anak-anak: sudut bulat besar, warna lembut
                card.className = `${item.bgClass} flex flex-col items-center justify-center p-6 rounded-[2rem] border-4 border-white shadow-[0_8px_0_rgba(0,0,0,0.05)] btn-bouncy`;
                card.id = `learn-card-${item.id}`;

                card.innerHTML = `
                    <span class="text-6xl md:text-7xl mb-4 drop-shadow-md">${item.emoji}</span>
                    <span class="text-2xl font-black text-gray-700 capitalize">${item.name}</span>
                `;

                card.onclick = () => {
                    // Animasi Pop
                    card.classList.remove('animate-pop');
                    void card.offsetWidth; // trigger reflow
                    card.classList.add('animate-pop');

                    // Suara panduan
                    speak(`${item.name}. Berwarna ${item.color}.`);
                };

                learnGrid.appendChild(card);
            });
        }

        function startPlayMode() {
            score = 0;
            updateScoreDisplay();
            nextQuestion();
        }

        function nextQuestion() {
            // Pilih satu item acak sebagai jawaban benar
            const randomIndex = Math.floor(Math.random() * dataItems.length);
            currentCorrectItem = dataItems[randomIndex];

            // Tampilkan tebakan
            riddleText.textContent = `"${currentCorrectItem.riddle}"`;
            speak(currentCorrectItem.riddle);

            // Pilih 2 item salah
            let wrongOptions = dataItems.filter(item => item.id !== currentCorrectItem.id);
            // Acak pilihan salah
            wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 2);

            // Gabungkan benar dan salah, lalu acak urutannya
            let finalOptions = [currentCorrectItem, ...wrongOptions];
            finalOptions = finalOptions.sort(() => 0.5 - Math.random());

            // Render tombol pilihan
            optionsContainer.innerHTML = '';
            finalOptions.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `bg-white border-4 border-rose-100 flex items-center justify-center py-8 rounded-[2rem] shadow-[0_8px_0_#fce7f3] btn-bouncy`;
                btn.innerHTML = `<span class="text-7xl md:text-8xl drop-shadow-md pointer-events-none">${item.emoji}</span>`;

                btn.onclick = () => checkAnswer(item.id, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function repeatRiddle() {
            if (currentCorrectItem) {
                speak(currentCorrectItem.riddle);
            }
        }

        function checkAnswer(selectedId, btnElement) {
            if (selectedId === currentCorrectItem.id) {
                // Jawaban Benar
                btnElement.classList.replace('border-rose-100', 'border-green-400');
                btnElement.classList.replace('shadow-[0_8px_0_#fce7f3]', 'shadow-[0_8px_0_#4ade80]');

                speak(`Pintar! Itu adalah ${currentCorrectItem.name}!`, () => {
                    score += 1;
                    updateScoreDisplay();
                    setTimeout(nextQuestion, 500);
                });

                // Tambahkan efek gemerlap sederhana di UI
                riddleText.textContent = `🎉 Benar! Itu ${currentCorrectItem.name}! 🎉`;

                // Matikan klik opsi lain
                const allBtns = optionsContainer.querySelectorAll('button');
                allBtns.forEach(b => b.onclick = null);

            } else {
                // Jawaban Salah
                btnElement.classList.remove('animate-shake');
                void btnElement.offsetWidth; // trigger reflow
                btnElement.classList.add('animate-shake');

                speak("Ups, coba lagi!");
            }
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = score;
        }

        function switchMode(mode) {
            window.speechSynthesis.cancel(); // Hentikan suara yang sedang berjalan
            currentMode = mode;

            const btnLearn = document.getElementById('btn-mode-learn');
            const btnPlay = document.getElementById('btn-mode-play');
            const viewLearn = document.getElementById('mode-learn');
            const viewPlay = document.getElementById('mode-play');

            if (mode === 'learn') {
                // Style tombol aktif Learn
                btnLearn.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-blue-400 text-white shadow-[0_4px_0_#2563eb] transition-all btn-bouncy";
                btnPlay.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all";

                viewLearn.classList.remove('hidden');
                viewPlay.classList.add('hidden');

                // Opsional: Sapaan saat kembali ke mode belajar
                speak("Ayo belajar nama buah dan sayur!");
            } else {
                // Style tombol aktif Play
                btnPlay.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-rose-400 text-white shadow-[0_4px_0_#f43f5e] transition-all btn-bouncy";
                btnLearn.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all";

                viewLearn.classList.add('hidden');
                viewPlay.classList.remove('hidden');

                startPlayMode();
            }
        }

        // Inisialisasi awal saat halaman dimuat
        window.onload = () => {
            renderLearnMode();
        };
    </script>
</body>

</html>
