<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pintar Kendaraan</title>

    <!-- Memuat Font Ramah Anak -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            red: '#ffb3ba',
                            orange: '#ffdfba',
                            yellow: '#ffffba',
                            green: '#baffc9',
                            blue: '#bae1ff',
                            purple: '#e8baff',
                            pink: '#ffc6ff',
                            cyan: '#9bf6ff',
                            lime: '#caffbf',
                            teal: '#a0c4ff'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Mencegah highlight biru saat anak-anak menyentuh layar */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        /* Animasi Tombol Membal (Bouncy) */
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.1);
        }

        .btn-bouncy:active {
            transform: translateY(6px) scale(0.95);
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.1);
        }

        /* Animasi Pop saat item ditekan */
        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: pop 0.4s ease-out;
        }

        /* Animasi Bergetar (Shake) untuk jawaban salah */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-10px);
            }

            40%,
            80% {
                transform: translateX(10px);
            }
        }

        .animate-shake {
            animation: shake 0.5s;
        }

        /* Animasi awan melayang */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-blue-50 min-h-screen text-gray-800 overflow-x-hidden flex flex-col font-sans">

    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col w-full flex-1">

        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-blue-500 mb-6 drop-shadow-sm animate-float">
                🚓 Pintar Kendaraan 🚁
            </h1>

            <div class="flex justify-center gap-4 bg-white/60 p-2 rounded-full shadow-sm max-w-sm mx-auto">
                <button onclick="switchMode('learn')" id="btn-mode-learn"
                    class="flex-1 py-3 px-4 rounded-full font-bold text-lg bg-blue-400 text-white shadow-[0_4px_0_#2563eb] transition-all btn-bouncy">
                    Belajar
                </button>
                <button onclick="switchMode('play')" id="btn-mode-play"
                    class="flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all">
                    Bermain
                </button>
            </div>
        </header>

        <main id="mode-learn" class="flex-1 flex flex-col">
            <div class="text-center mb-6">
                <p
                    class="text-xl font-bold text-gray-600 bg-white inline-block px-6 py-2 rounded-full shadow-sm border-2 border-blue-100">
                    Sentuh kendaraannya! 👇
                </p>
            </div>
            <!-- Grid Kendaraan -->
            <div id="learn-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 pb-10">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </main>

        <main id="mode-play" class="flex-1 flex flex-col hidden pb-10 max-w-3xl mx-auto w-full">
            <div
                class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm mb-6 border-4 border-blue-200">
                <div class="text-xl font-black text-blue-500 flex items-center gap-2">
                    <span>⭐ Skor:</span>
                    <span id="score-display" class="text-2xl">0</span>
                </div>
                <button onclick="repeatQuestion()"
                    class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-xl font-bold btn-bouncy flex items-center gap-2 border-2 border-white shadow-sm">
                    🔊 Ulangi Suara
                </button>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-lg text-center mb-8 border-b-8 border-blue-200">
                <p id="instruction-text" class="text-2xl md:text-3xl font-bold text-gray-700 leading-snug">
                    Dengarkan suaranya...
                </p>
            </div>

            <!-- Area Pilihan Ganda -->
            <div id="options-container" class="grid grid-cols-3 gap-4">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>
        </main>
    </div>

    <script>
        // Data 10 Kendaraan
        const vehicles = [
            { id: 'mobil', name: 'Mobil', emoji: '🚗', bgClass: 'bg-pastel-blue' },
            { id: 'kereta', name: 'Kereta Api', emoji: '🚂', bgClass: 'bg-pastel-orange' },
            { id: 'pesawat', name: 'Pesawat', emoji: '✈️', bgClass: 'bg-pastel-yellow' },
            { id: 'kapal', name: 'Kapal', emoji: '🚢', bgClass: 'bg-pastel-purple' },
            { id: 'motor', name: 'Motor', emoji: '🏍️', bgClass: 'bg-pastel-green' },
            { id: 'sepeda', name: 'Sepeda', emoji: '🚲', bgClass: 'bg-pastel-pink' },
            { id: 'polisi', name: 'Mobil Polisi', emoji: '🚓', bgClass: 'bg-pastel-cyan' },
            { id: 'bus', name: 'Bus', emoji: '🚌', bgClass: 'bg-pastel-lime' },
            { id: 'pemadam', name: 'Pemadam Kebakaran', emoji: '🚒', bgClass: 'bg-pastel-red' },
            { id: 'taksi', name: 'Taksi', emoji: '🚕', bgClass: 'bg-pastel-teal' }
        ];

        let currentMode = 'learn';
        let score = 0;
        let currentCorrectItem = null;
        let audioCtx = null;

        const learnGrid = document.getElementById('learn-grid');
        const optionsContainer = document.getElementById('options-container');
        const instructionText = document.getElementById('instruction-text');
        const scoreDisplay = document.getElementById('score-display');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function synthesizeSound(vehicleId, callback) {
            initAudio();
            const now = audioCtx.currentTime;
            let duration = 1.0; // Default

            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.value = 0.3; // Volume Master

            if (vehicleId === 'mobil') {
                duration = 0.6;
                const osc = audioCtx.createOscillator();
                osc.type = 'square';
                osc.frequency.value = 400;

                const gain = audioCtx.createGain();
                gain.connect(masterGain);
                osc.connect(gain);

                // 2 bunyi klakson
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(1, now + 0.05);
                gain.gain.setValueAtTime(1, now + 0.2);
                gain.gain.linearRampToValueAtTime(0, now + 0.25);

                gain.gain.setValueAtTime(0, now + 0.35);
                gain.gain.linearRampToValueAtTime(1, now + 0.4);
                gain.gain.setValueAtTime(1, now + 0.55);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'kereta') {
                duration = 1.5;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'square';
                osc2.type = 'square';
                osc1.frequency.value = 330;
                osc2.frequency.value = 415;

                const gain = audioCtx.createGain();
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(masterGain);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
                gain.gain.setValueAtTime(0.5, now + 0.6);
                gain.gain.linearRampToValueAtTime(0, now + 0.7);

                gain.gain.linearRampToValueAtTime(0.5, now + 0.8);
                gain.gain.setValueAtTime(0.5, now + 1.3);
                gain.gain.linearRampToValueAtTime(0, now + 1.4);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration);
                osc2.stop(now + duration);

            } else if (vehicleId === 'pesawat') {
                duration = 2.5;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'sawtooth';
                osc2.type = 'sawtooth';
                osc1.frequency.value = 60;
                osc2.frequency.value = 62;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';

                const gain = audioCtx.createGain();
                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                filter.frequency.setValueAtTime(100, now);
                filter.frequency.exponentialRampToValueAtTime(1000, now + 1.2);
                filter.frequency.exponentialRampToValueAtTime(100, now + 2.5);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 1.0);
                gain.gain.linearRampToValueAtTime(0, now + 2.5);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration);
                osc2.stop(now + duration);

            } else if (vehicleId === 'kapal') {
                duration = 2.0;
                const osc = audioCtx.createOscillator();
                osc.type = 'square';
                osc.frequency.value = 80;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 300;

                const gain = audioCtx.createGain();
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.8, now + 0.2);
                gain.gain.setValueAtTime(0.8, now + 1.6);
                gain.gain.linearRampToValueAtTime(0, now + 2.0);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'motor') {
                duration = 1.5;
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';

                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);

                // Suara geberan motor (naik turun frekuensi)
                osc.frequency.setValueAtTime(50, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.5);
                osc.frequency.linearRampToValueAtTime(70, now + 0.8);
                osc.frequency.linearRampToValueAtTime(200, now + 1.2);
                osc.frequency.linearRampToValueAtTime(50, now + 1.5);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.7, now + 0.1);
                gain.gain.setValueAtTime(0.7, now + 1.4);
                gain.gain.linearRampToValueAtTime(0, now + 1.5);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'sepeda') {
                duration = 0.8;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 1200; // Tinggi "kring kring"

                const gain = audioCtx.createGain();
                gain.connect(masterGain);
                osc.connect(gain);

                // 2 dering sangat cepat
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(1, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);

                gain.gain.setValueAtTime(0, now + 0.25);
                gain.gain.linearRampToValueAtTime(1, now + 0.30);
                gain.gain.linearRampToValueAtTime(0, now + 0.40);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'polisi') {
                duration = 2.0;
                const osc = audioCtx.createOscillator();
                osc.type = 'square';

                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);

                // Ninu ninu bergantian cepat
                for (let i = 0; i < 4; i++) {
                    let t = now + (i * 0.5);
                    osc.frequency.setValueAtTime(700, t);
                    osc.frequency.setValueAtTime(950, t + 0.25);
                }

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.1);
                gain.gain.setValueAtTime(0.5, now + 1.9);
                gain.gain.linearRampToValueAtTime(0, now + 2.0);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'bus') {
                duration = 1.0;
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = 120; // Honk sangat berat/dalam

                const gain = audioCtx.createGain();
                gain.connect(masterGain);
                osc.connect(gain);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.8, now + 0.1);
                gain.gain.setValueAtTime(0.8, now + 0.4);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);

                gain.gain.setValueAtTime(0, now + 0.6);
                gain.gain.linearRampToValueAtTime(0.8, now + 0.7);
                gain.gain.setValueAtTime(0.8, now + 0.9);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'pemadam') {
                duration = 3.0;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';

                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);

                // Sirine melolong naik turun secara lambat
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 1.5);
                osc.frequency.linearRampToValueAtTime(600, now + 3.0);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.8, now + 0.2);
                gain.gain.setValueAtTime(0.8, now + 2.8);
                gain.gain.linearRampToValueAtTime(0, now + 3.0);

                osc.start(now);
                osc.stop(now + duration);

            } else if (vehicleId === 'taksi') {
                duration = 0.5;
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 550; // Klakson ringan "Beep beep"

                const gain = audioCtx.createGain();
                gain.connect(masterGain);
                osc.connect(gain);

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.6, now + 0.05);
                gain.gain.setValueAtTime(0.6, now + 0.15);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);

                gain.gain.setValueAtTime(0, now + 0.3);
                gain.gain.linearRampToValueAtTime(0.6, now + 0.35);
                gain.gain.setValueAtTime(0.6, now + 0.45);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);

                osc.start(now);
                osc.stop(now + duration);
            }

            setTimeout(() => {
                if (callback) callback();
            }, duration * 1000 + 100);
        }

        function speak(text, callback = null) {
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = 1.3;
            utterance.rate = 0.9;

            utterance.onend = () => {
                if (callback) callback();
            };

            window.speechSynthesis.speak(utterance);
        }

        function renderLearnMode() {
            learnGrid.innerHTML = '';
            vehicles.forEach(vehicle => {
                const card = document.createElement('button');
                card.className = `${vehicle.bgClass} flex flex-col items-center justify-center p-6 md:p-8 rounded-[2rem] border-4 border-white shadow-[0_8px_0_rgba(0,0,0,0.05)] btn-bouncy`;

                card.innerHTML = `
                    <span class="text-6xl md:text-7xl mb-4 drop-shadow-md">${vehicle.emoji}</span>
                    <span class="text-xl md:text-2xl font-black text-gray-700 capitalize">${vehicle.name}</span>
                `;

                card.onclick = () => {
                    initAudio();
                    card.classList.remove('animate-pop');
                    void card.offsetWidth;
                    card.classList.add('animate-pop');

                    // Baca nama, lalu mainkan suara
                    speak(vehicle.name, () => {
                        synthesizeSound(vehicle.id);
                    });
                };

                learnGrid.appendChild(card);
            });
        }

        function startPlayMode() {
            initAudio();
            score = 0;
            updateScoreDisplay();
            nextQuestion();
        }

        function nextQuestion() {
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => b.onclick = null);
            instructionText.textContent = "Mendengarkan...";

            const randomIndex = Math.floor(Math.random() * vehicles.length);
            currentCorrectItem = vehicles[randomIndex];

            let wrongOptions = vehicles.filter(v => v.id !== currentCorrectItem.id);
            wrongOptions = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 2);

            let finalOptions = [currentCorrectItem, ...wrongOptions];
            finalOptions = finalOptions.sort(() => 0.5 - Math.random());

            optionsContainer.innerHTML = '';
            finalOptions.forEach(vehicle => {
                const btn = document.createElement('button');
                btn.className = `bg-white border-4 border-blue-100 flex items-center justify-center py-10 rounded-[2rem] shadow-[0_8px_0_#dbeafe] btn-bouncy`;
                btn.innerHTML = `<span class="text-7xl md:text-8xl drop-shadow-md pointer-events-none">${vehicle.emoji}</span>`;

                btn.disabled = true;
                btn.onclick = () => checkAnswer(vehicle.id, btn);
                optionsContainer.appendChild(btn);
            });

            // Suara instruksi -> Suara kendaraan -> Buka tombol
            speak("Tebak suara apa ini?", () => {
                instructionText.textContent = "Pilih gambar yang benar!";
                synthesizeSound(currentCorrectItem.id, () => {
                    const renderedBtns = optionsContainer.querySelectorAll('button');
                    renderedBtns.forEach(b => b.disabled = false);
                });
            });
        }

        function repeatQuestion() {
            if (currentCorrectItem) {
                const renderedBtns = optionsContainer.querySelectorAll('button');
                renderedBtns.forEach(b => b.disabled = true);

                instructionText.textContent = "Mendengarkan...";

                synthesizeSound(currentCorrectItem.id, () => {
                    instructionText.textContent = "Pilih gambar yang benar!";
                    renderedBtns.forEach(b => b.disabled = false);
                });
            }
        }

        function checkAnswer(selectedId, btnElement) {
            if (selectedId === currentCorrectItem.id) {
                btnElement.classList.replace('border-blue-100', 'border-green-400');
                btnElement.classList.replace('shadow-[0_8px_0_#dbeafe]', 'shadow-[0_8px_0_#4ade80]');

                const allBtns = optionsContainer.querySelectorAll('button');
                allBtns.forEach(b => { b.disabled = true; b.onclick = null; });

                instructionText.textContent = `🎉 Benar! Itu ${currentCorrectItem.name}! 🎉`;

                speak(`Pintar! Itu ${currentCorrectItem.name}!`, () => {
                    score += 10; // Nilai 10 untuk kebanggaan anak
                    updateScoreDisplay();
                    setTimeout(nextQuestion, 1500);
                });

            } else {
                btnElement.classList.remove('animate-shake');
                void btnElement.offsetWidth;
                btnElement.classList.add('animate-shake');

                speak("Ups, coba lagi!");
            }
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = score;
        }

        function switchMode(mode) {
            window.speechSynthesis.cancel();
            currentMode = mode;

            const btnLearn = document.getElementById('btn-mode-learn');
            const btnPlay = document.getElementById('btn-mode-play');
            const viewLearn = document.getElementById('mode-learn');
            const viewPlay = document.getElementById('mode-play');

            if (mode === 'learn') {
                btnLearn.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-blue-400 text-white shadow-[0_4px_0_#2563eb] transition-all btn-bouncy";
                btnPlay.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all";

                viewLearn.classList.remove('hidden');
                viewPlay.classList.add('hidden');

                speak("Sentuh gambarnya untuk belajar!");
            } else {
                btnPlay.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-rose-400 text-white shadow-[0_4px_0_#f43f5e] transition-all btn-bouncy";
                btnLearn.className = "flex-1 py-3 px-4 rounded-full font-bold text-lg bg-white text-gray-500 shadow-none transition-all";

                viewLearn.classList.add('hidden');
                viewPlay.classList.remove('hidden');

                startPlayMode();
            }
        }

        window.onload = () => {
            renderLearnMode();
        };
    </script>
</body>

</html>
