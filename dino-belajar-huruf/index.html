<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Belajar Huruf - Game Edukasi Anak</title>

    <!-- Menggunakan font Fredoka One agar terlihat bulat dan lucu untuk anak-anak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'nunito': ['Nunito', 'sans-serif'],
                        'fredoka': ['"Fredoka One"', 'cursive'],
                    },
                    colors: {
                        pastel: {
                            blue: '#BAE6FD',
                            green: '#BBF7D0',
                            yellow: '#FEF08A',
                            pink: '#FBCFE8',
                            purple: '#E9D5FF',
                            orange: '#FFEDD5'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 60%, #BBF7D0 100%);
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Animasi Dino melayang/bernapas */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        /* Animasi salah (geleng/getar) */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0) rotate(0deg);
            }

            20% {
                transform: translateX(-8px) rotate(-5deg);
            }

            40% {
                transform: translateX(8px) rotate(5deg);
            }

            60% {
                transform: translateX(-8px) rotate(-5deg);
            }

            80% {
                transform: translateX(8px) rotate(5deg);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Animasi benar (membesar dan meletus) */
        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2) rotate(10deg);
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .animate-pop {
            animation: pop 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bentuk Telur menggunakan CSS */
        .egg-shape {
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset -10px -15px 20px rgba(0, 0, 0, 0.1), 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .egg-shape:active {
            transform: scale(0.95);
            box-shadow: inset -5px -8px 10px rgba(0, 0, 0, 0.1), 0 5px 8px rgba(0, 0, 0, 0.1);
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .text-shadow-sm {
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .text-shadow-lg {
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col items-center justify-center no-select">

    <canvas id="confetti-canvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen"
        class="absolute inset-0 z-40 bg-white/40 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <h1 class="text-5xl md:text-7xl font-fredoka text-blue-500 mb-4 text-shadow-sm border-white drop-shadow-xl">Dino
            Belajar<br>Huruf!</h1>
        <p
            class="text-xl md:text-2xl text-gray-700 mb-10 font-bold max-w-md bg-white/70 px-6 py-3 rounded-full shadow-sm">
            Bantu Dino menemukan huruf di dalam telur!
        </p>

        <!-- Ilustrasi Dino Start -->
        <svg class="w-40 h-40 mb-10 animate-float drop-shadow-2xl" viewBox="0 0 100 100">
            <!-- Badan T-Rex Lucu -->
            <path d="M 30 90 Q 30 50 40 30 L 60 20 Q 80 20 85 35 L 85 50 Q 85 60 70 60 L 65 60 L 65 80 Q 65 90 55 90 Z"
                fill="#3B82F6" />
            <path d="M 40 90 L 40 80 L 45 80 L 45 90 Z" fill="#2563EB" />
            <!-- Perut -->
            <path d="M 35 70 Q 55 75 60 60 L 60 40 Q 40 45 35 70 Z" fill="#93C5FD" />
            <!-- Mata -->
            <circle cx="65" cy="35" r="6" fill="white" />
            <circle cx="67" cy="35" r="3" fill="black" />
            <!-- Mulut Senyum -->
            <path d="M 72 45 Q 77 50 82 45" stroke="black" stroke-width="2" stroke-linecap="round" fill="none" />
            <!-- Tangan kecil -->
            <path d="M 60 55 L 75 50" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
            <path d="M 60 58 L 73 55" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
        </svg>

        <button onclick="startGame()"
            class="bg-blue-500 hover:bg-blue-400 text-white text-3xl md:text-4xl font-fredoka py-4 px-12 rounded-full shadow-[0_8px_0_#1D4ED8] hover:shadow-[0_4px_0_#1D4ED8] hover:translate-y-1 transition-all">
            Mulai Main
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden w-full max-w-4xl flex-col items-center justify-between h-full py-6 px-4">

        <!-- Papan Instruksi -->
        <div class="text-center mt-2 z-10">
            <div
                class="bg-white/90 px-8 py-3 rounded-full border-4 border-blue-400 shadow-[0_6px_0_#60A5FA] inline-block">
                <h2 class="text-3xl md:text-5xl font-fredoka text-gray-700">
                    Cari huruf: <span id="target-letter-display"
                        class="text-red-500 text-5xl md:text-6xl inline-block ml-2 animate-bounce text-shadow-sm">A</span>
                </h2>
            </div>
        </div>

        <!-- Karakter Dino -->
        <div class="flex-1 flex items-center justify-center relative w-full my-4">
            <!-- Bintang sukses (Awalnya sembunyi) -->
            <div id="success-message"
                class="absolute top-1/4 z-30 hidden pointer-events-none transition-all duration-300">
                <h3
                    class="text-5xl md:text-7xl font-fredoka text-yellow-400 text-shadow-lg bg-white/90 px-8 py-4 rounded-full border-4 border-yellow-400 rotate-[-5deg]">
                    Hebat! ⭐
                </h3>
            </div>

            <!-- SVG Dino di tengah layar -->
            <div id="dino-container" class="animate-float transition-transform duration-300 z-10 relative">
                <!-- SVG injected via JS -->
            </div>
        </div>

        <!-- Pilihan Telur (Opsi Jawaban) -->
        <div class="w-full mt-auto pb-6 z-20">
            <div id="eggs-container" class="flex justify-center gap-6 sm:gap-10 flex-wrap">
                <!-- Tombol telur akan dimuat di sini -->
            </div>
        </div>
    </div>

    <script>
        // Data Game
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const eggColors = [
            { bg: 'bg-red-400', border: 'border-red-300', text: 'text-white' },
            { bg: 'bg-green-400', border: 'border-green-300', text: 'text-white' },
            { bg: 'bg-yellow-400', border: 'border-yellow-300', text: 'text-gray-800' },
            { bg: 'bg-purple-400', border: 'border-purple-300', text: 'text-white' },
            { bg: 'bg-pink-400', border: 'border-pink-300', text: 'text-white' },
            { bg: 'bg-orange-400', border: 'border-orange-300', text: 'text-white' }
        ];

        let targetLetter = '';
        let audioContext = null;
        let isAnimating = false;

        // Inisialisasi Suara (Web Audio API)
        function initAudio() {
            if (!audioContext) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Putar efek suara tanpa file eksternal
        function playSound(type) {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'success') {
                // Suara gembira (Ting-Ting!)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime); // E5
                oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioContext.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Suara boop lembut
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(250, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.2);
            }
        }

        // Generate SVG Dino (T-Rex)
        function renderDino(isHappy = false) {
            const mouth = isHappy ?
                `<path d="M 72 40 Q 80 55 85 40 Z" fill="#7F1D1D" />` : // Mulut terbuka lebar
                `<path d="M 72 45 Q 77 50 82 45" stroke="black" stroke-width="2" stroke-linecap="round" fill="none" />`; // Senyum biasa

            const eye = isHappy ?
                `<path d="M 62 35 Q 65 30 68 35" stroke="black" stroke-width="2" stroke-linecap="round" fill="none" />` : // Mata merem senang
                `<circle cx="65" cy="35" r="5" fill="white" /><circle cx="67" cy="35" r="2.5" fill="black" />`; // Mata biasa

            return `
            <svg class="w-48 h-48 sm:w-64 sm:h-64 drop-shadow-2xl" viewBox="0 0 100 100">
                <!-- Badan -->
                <path d="M 30 90 Q 30 50 40 30 L 60 20 Q 80 20 85 35 L 85 50 Q 85 60 70 60 L 65 60 L 65 80 Q 65 90 55 90 Z" fill="#3B82F6" />
                <path d="M 40 90 L 40 80 L 45 80 L 45 90 Z" fill="#2563EB" />
                <!-- Perut -->
                <path d="M 35 70 Q 55 75 60 60 L 60 40 Q 40 45 35 70 Z" fill="#93C5FD" />
                
                ${eye}
                ${mouth}
                
                <!-- Pipi merah -->
                <circle cx="58" cy="45" r="4" fill="rgba(239, 68, 68, 0.4)" />
                
                <!-- Tangan -->
                <path d="M 60 55 L 75 50" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
                <path d="M 60 58 L 73 55" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
                
                <!-- Duri Punggung -->
                <path d="M 40 30 L 35 20 L 48 25 Z" fill="#FCD34D" />
                <path d="M 32 45 L 22 38 L 35 40 Z" fill="#FCD34D" />
                <path d="M 30 65 L 18 60 L 32 58 Z" fill="#FCD34D" />
            </svg>`;
        }

        function startGame() {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            loadNextLevel();
        }

        function loadNextLevel() {
            isAnimating = false;
            document.getElementById('success-message').classList.add('hidden');

            // Kembalikan dino ke posisi semula
            const dinoContainer = document.getElementById('dino-container');
            dinoContainer.innerHTML = renderDino(false);
            dinoContainer.style.transform = 'scale(1)';

            // Pilih huruf target secara acak
            targetLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

            // Update teks instruksi (gunakan warna acak untuk hurufnya agar menarik)
            const targetDisplay = document.getElementById('target-letter-display');
            targetDisplay.textContent = targetLetter;
            const textColors = ['text-red-500', 'text-blue-600', 'text-green-600', 'text-purple-600', 'text-orange-500'];
            targetDisplay.className = `inline-block ml-2 animate-bounce text-5xl md:text-6xl text-shadow-sm ${textColors[Math.floor(Math.random() * textColors.length)]}`;

            // Buat opsi (1 benar, 2 salah)
            let options = [targetLetter];

            let wrong1;
            do { wrong1 = alphabet[Math.floor(Math.random() * alphabet.length)]; } while (wrong1 === targetLetter);

            let wrong2;
            do { wrong2 = alphabet[Math.floor(Math.random() * alphabet.length)]; } while (wrong2 === targetLetter || wrong2 === wrong1);

            options.push(wrong1, wrong2);
            options.sort(() => 0.5 - Math.random()); // Acak urutan

            // Render Telur
            const container = document.getElementById('eggs-container');
            container.innerHTML = '';

            // Acak urutan warna telur
            const shuffledColors = [...eggColors].sort(() => 0.5 - Math.random());

            options.forEach((letter, index) => {
                const colorTheme = shuffledColors[index];
                const egg = document.createElement('div');

                egg.className = `egg-shape w-24 h-32 sm:w-32 sm:h-44 ${colorTheme.bg} border-4 ${colorTheme.border} flex items-center justify-center cursor-pointer m-2`;

                egg.innerHTML = `<span class="text-5xl sm:text-7xl font-fredoka ${colorTheme.text} drop-shadow-md pointer-events-none">${letter}</span>`;

                egg.onclick = () => handleEggClick(letter, egg);
                container.appendChild(egg);
            });
        }

        function handleEggClick(clickedLetter, element) {
            if (isAnimating) return;

            if (clickedLetter === targetLetter) {
                // Jawaban Benar
                isAnimating = true;
                playSound('success');

                // Telur pecah/menghilang
                element.classList.add('animate-pop');

                // Dino bereaksi senang
                const dinoContainer = document.getElementById('dino-container');
                dinoContainer.innerHTML = renderDino(true);
                dinoContainer.style.transform = 'scale(1.15) translateY(-20px)';

                // Tampilkan pesan
                document.getElementById('success-message').classList.remove('hidden');

                fireConfetti();

                // Lanjut ke level berikutnya setelah delay
                setTimeout(() => {
                    loadNextLevel();
                }, 2000);

            } else {
                // Jawaban Salah
                playSound('wrong');

                // Efek getar dan ubah warna sedikit pudar
                element.classList.remove('animate-shake');
                void element.offsetWidth; // trigger reflow
                element.classList.add('animate-shake');

                // Tambahkan overlay kelabu sejenak
                const originalBg = element.className;
                element.style.filter = 'grayscale(50%) opacity(0.8)';
                setTimeout(() => {
                    element.style.filter = 'none';
                }, 500);
            }
        }

        // Sistem Confetti
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            const colors = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899'];
            particles = [];

            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -15 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }

            if (!animationFrameId) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = 0;

            particles.forEach((p) => {
                p.tiltAngle += p.tiltAngleIncrement;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // Gravitasi
                p.y += p.dy;

                if (p.y <= canvas.height) {
                    activeParticles++;
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                }
            });

            if (activeParticles > 0) {
                animationFrameId = requestAnimationFrame(animateConfetti);
            } else {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>

</html>
